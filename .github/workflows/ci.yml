name: CI

on:
  push:
    branches:
      - dev
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'ci/**'
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: meeny-backend

jobs:
  build:
    name: Gradle build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build (compile + test)
        run: ./gradlew --no-daemon build

      # 실패한 테스트 리포트는 항상 남겨 디버깅에 쓸 수 있게.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # 이미지 빌드/푸시는 main 으로의 push 일 때만 (= 배포 직전 PR merge / 직접 push).
  # dev·피쳐 브랜치·PR 이벤트에서는 안 돌아가고, 테스트(build job) 실패 시에도 needs: build 로 차단됨.
  build-and-push:
    name: Build and push image to ECR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # id-token: write 가 있어야 OIDC 토큰 발급이 가능. 정적 access key 없이 role assume.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # OIDC 로 IAM role assume. role 의 신뢰관계가 meeny-team/backend + refs/heads/main 으로
      # 한정되어 있어 다른 repo / 브랜치는 이 role 을 가져갈 수 없음.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::505947591451:role/meeny-backend-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 두 태그 동시 발행:
      #   :<sha>      불변 — 배포 매니페스트가 정확히 이 이미지를 가리키게 (롤백 가능).
      #   :<branch>   가변 — "dev 의 최신" / "main 의 최신" 편의 태그.
      # 멀티아치: amd64(t3.micro 같은 x86 인스턴스/프리티어) + arm64(t4g/Graviton).
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed tags
        run: |
          echo "Pushed:"
          echo "  ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "  ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}"
