name: Build & Push to ECR

# dev/main 으로 들어가는(=PR merge 또는 직접 push) 코드만 이미지화. 피쳐 브랜치 푸시마다 빌드하면 비용/캐시만 낭비.
# 수동 트리거(workflow_dispatch) 도 열어둠 — hotfix 재빌드용.
on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: meeny-backend

jobs:
  build-and-push:
    name: Build and push image
    # arm64 네이티브 러너 — Gradle bootJar 같은 컴파일 무거운 단계를 QEMU 에뮬 없이 돌리려고.
    # 만약 플랜에서 ARM 러너가 막혀 있다면: runs-on 을 ubuntu-latest 로 되돌리고
    # docker/setup-qemu-action@v3 을 한 단계 추가한 뒤 platforms: linux/arm64 만 둬도 동작 (속도 손해 있음).
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 두 태그 동시 발행:
      #   :<sha>      불변 — 배포 매니페스트가 정확히 이 이미지를 가리키게 (롤백 가능).
      #   :<branch>   가변 — "dev 의 최신" / "main 의 최신" 이라는 의미로 편의용.
      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # 네이티브 ARM 러너에서 빌드하므로 emulation 없이 단일 platform 만 발행.
          # 추후 멀티아치 (amd64+arm64) 가 필요해지면 "linux/amd64,linux/arm64" 로 늘리고
          # ubuntu-latest 러너에서 QEMU 셋업 필요.
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pushed tags
        run: |
          echo "Pushed:"
          echo "  ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}"
          echo "  ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.ref_name }}"
