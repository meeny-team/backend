spring:
  application:
    name: meeny

  # 기본 = 로컬 개발(H2 인메모리). prod/local 프로필은 datasource·시크릿을 모두 덮어쓴다.
  datasource:
    url: jdbc:h2:mem:meenydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 기본 프로필(H2 인메모리, 테스트)에서는 Flyway 비활성. PostgreSQL 전용 DDL이라 H2에서 깨지고,
  # ddl-auto: create-drop이 매 실행마다 스키마를 재구성하므로 마이그레이션 도구가 불필요.
  flyway:
    enabled: false

jwt:
  # 운영에서는 application-prod.yaml에서 ${JWT_SECRET}을 강제. dev 편의를 위해 여기엔 더미값을 둔다.
  secret: ${JWT_SECRET:meeny-jwt-secret-key-for-dev-only-must-be-at-least-32-bytes}
  access-token-expire-ms: 3600000
  refresh-token-expire-ms: 604800000

oauth:
  # 외부 API 엔드포인트 URL은 yaml로 노출해서 테스트 시 MockWebServer로 가로챌 수 있게 함.
  # 실제 운영에서 바꿀 일은 거의 없지만 설정 가능성을 열어둠.
  kakao:
    profile-uri: https://kapi.kakao.com/v2/user/me
  apple:
    client-id: ${APPLE_CLIENT_ID:com.meeny.app}
    jwks-uri: https://appleid.apple.com/auth/keys
  # Google은 플랫폼별 client_id가 다르므로 콤마 구분 리스트로 모두 허용 (web/iOS/Android).
  # 로컬 dev에서 실 Google 로그인 검증을 안 하면 비워둘 수 있음 (audience 검증에서 차단되어 결과적으로 Google 로그인 비활성).
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
    jwks-uri: https://www.googleapis.com/oauth2/v3/certs

# 카카오 Local API (장소 검색) 프록시. REST API 키는 환경변수로 주입 — 클라이언트엔 절대 노출 X.
kakao:
  local:
    rest-api-key: ${KAKAO_REST_API_KEY:}
    keyword-search-uri: https://dapi.kakao.com/v2/local/search/keyword.json

# 로컬 개발 검증용 dev-login 엔드포인트 (POST /api/auth/dev/login).
# 운영 배포 시 반드시 false로 두어야 합니다 (prod 프로필이 자동으로 false로 덮어씀).
auth:
  dev-login:
    enabled: ${AUTH_DEV_LOGIN_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Actuator: /actuator/health 만 노출. K8s 등에서 liveness/readiness probe로 직접 사용하도록 활성화.
# show-details=never 로 외부에 시스템 내부 상태(빌더 컴포넌트 결과)는 노출하지 않음.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# 이미지 업로드용 S3. bucket / access-key 가 비어 있으면 UploadService가 호출 시 UPLOAD_NOT_CONFIGURED를 던져 dev 환경에서도 부팅은 가능.
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key-id: ${AWS_S3_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_S3_SECRET_ACCESS_KEY:}
    presigned-url-expiry-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRY_MINUTES:10}
    read-url-expiry-minutes: ${AWS_S3_READ_URL_EXPIRY_MINUTES:60}
