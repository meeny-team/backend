# 로컬 PostgreSQL 검증용 프로필: docker-compose로 띄운 컨테이너에 접속, ddl-auto는 update로 스키마 자동 반영.
# `SPRING_PROFILES_ACTIVE=local ./gradlew bootRun` 으로 사용.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meeny}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:meeny}
    password: ${DB_PASSWORD:meeny}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 로컬 PostgreSQL도 운영과 동일하게 Flyway로 스키마 관리. 첫 부팅 전 docker volume이 비어 있어야 함
  # (기존 ddl-auto: update로 만든 스키마가 남아 있으면 충돌 → docker compose down -v 후 재기동).
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
