# 운영 프로필: 모든 시크릿을 환경변수로 강제, ddl-auto는 validate(스키마 변경은 마이그레이션 도구로)
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

# 운영에서는 Google 플랫폼별 client_id를 환경변수로 강제 (없으면 모든 Google 토큰이 audience 검증에서 거절됨)
oauth:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS}

auth:
  dev-login:
    enabled: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
