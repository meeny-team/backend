# 운영 프로필: 모든 시크릿을 환경변수로 강제, ddl-auto는 validate(스키마 변경은 마이그레이션 도구로)
spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # 운영 스키마 변경은 db/migration 의 V*__*.sql 만으로 관리. baseline-on-migrate=false 이므로
  # 깨끗한 DB로 시작하거나, 기존 데이터가 있다면 운영 첫 적용 시점에 따로 baseline 절차를 거쳐야 함.
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}

# 운영에서는 Google 플랫폼별 client_id를 환경변수로 강제 (없으면 모든 Google 토큰이 audience 검증에서 거절됨)
oauth:
  google:
    client-ids: ${GOOGLE_CLIENT_IDS}

auth:
  dev-login:
    enabled: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}

# Sentry — backend application errors / exceptions. DSN 은 공개 식별자라 하드코딩 OK.
# 환경별로 별도 Sentry 프로젝트 쓰고 싶어지면 ${SENTRY_DSN} env 로 전환.
sentry:
  dsn: https://a93720968392e63b386f7c3bd92c62df@o4511488644481024.ingest.us.sentry.io/4511488800784384
  environment: production
  # 1인 운영 무료 quota 보호 — 트랜잭션은 10% 만 샘플링
  enable-tracing: true
  traces-sample-rate: 0.1
  # Spring Boot 가 자동 등록한 SentryExceptionResolver 가 GlobalExceptionHandler 보다 먼저 돌아
  # @ExceptionHandler 가 잡아서 4xx 로 변환한 예외도 Sentry 로 보내진다.
  exception-resolver-order: -2147483647
  # 기대된 4xx (도메인 비즈 위반 / 입력 검증 실패) 는 Sentry 로 안 보냄 — 노이즈만 늘고 진짜 에러 묻힘.
  ignored-exceptions-for-type:
    - com.meeny.common.exception.BusinessException
    - org.springframework.web.bind.MethodArgumentNotValidException
    - org.springframework.web.HttpRequestMethodNotSupportedException
    - org.springframework.web.servlet.NoHandlerFoundException
